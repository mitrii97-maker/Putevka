<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0f14">
    <title>БелАЗ | Смена</title>
    <link rel="apple-touch-icon" sizes="180x180" href="https://img.icons8.com/fluency/180/truck.png">

<style>
:root {
    --bg: #070a0f;
    --panel: rgba(15, 23, 42, 0.68);
    --panel-strong: rgba(15, 23, 42, 0.92);
    --line: rgba(255, 255, 255, 0.13);
    --line-strong: rgba(255, 255, 255, 0.20);
    --muted: rgba(226, 232, 240, 0.66);
    --text: #f8fafc;
    --orange: #f59e0b;
    --blue: #38bdf8;
    --green: #22c55e;
    --red: #fb7185;
    --violet: #a78bfa;
    --yellow: #fde047;
    --shadow: 0 20px 60px rgba(0, 0, 0, 0.42);
    --inner: inset 0 1px rgba(255, 255, 255, 0.16);
    --page-x: 14px;
    --safe-top: max(16px, env(safe-area-inset-top));
    --safe-bottom: max(14px, env(safe-area-inset-bottom));
    --card-h: 88px;
    --card-title: 29px;
    --card-trips: 43px;
    --card-gap: 9px;
    --button-size: 56px;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    height: 100%;
    min-height: 100%;
    background: var(--bg);
    overflow: hidden;
}

body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    background:
        radial-gradient(circle at 20% -8%, rgba(56, 189, 248, 0.30), transparent 34rem),
        radial-gradient(circle at 100% 0%, rgba(34, 197, 94, 0.18), transparent 30rem),
        radial-gradient(circle at 15% 98%, rgba(245, 158, 11, 0.16), transparent 26rem),
        linear-gradient(180deg, rgba(2, 6, 23, 0.44), rgba(2, 6, 23, 0.96)),
        url("bag.WEBP") center / cover fixed no-repeat,
        #070a0f;
    padding: var(--safe-top) 0 calc(96px + var(--safe-bottom));
    overflow: hidden;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -webkit-text-size-adjust: 100%;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.65), transparent 76%);
}

button,
input {
    font: inherit;
    user-select: text;
    -webkit-user-select: text;
}

button {
    cursor: pointer;
}

.shell {
    position: relative;
    width: min(430px, 100%);
    height: calc(100dvh - var(--safe-top) - var(--safe-bottom) - 96px);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

.topbar {
    flex: none;
    padding: 0 var(--page-x) 10px;
}

.brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.brand-title {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.brand-title strong {
    font-size: clamp(34px, 8.8vw, 44px);
    line-height: 0.92;
    letter-spacing: -1.4px;
    text-shadow: 0 12px 34px rgba(56, 189, 248, 0.18);
}

.brand-title span,
.label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 850;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

.status-chip {
    min-width: 104px;
    padding: 10px 12px;
    border: 1px solid rgba(34, 197, 94, 0.34);
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(34, 197, 94, 0.16), rgba(15, 23, 42, 0.54));
    color: #bbf7d0;
    font-size: 13px;
    font-weight: 900;
    text-align: center;
    box-shadow: var(--inner), 0 12px 28px rgba(34, 197, 94, 0.10);
}

.glass {
    border: 1px solid var(--line);
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.10), rgba(15, 23, 42, 0.66));
    -webkit-backdrop-filter: blur(22px) saturate(1.35);
    backdrop-filter: blur(22px) saturate(1.35);
    box-shadow: var(--shadow), var(--inner);
}

.dashboard {
    flex: none;
    margin: 0 var(--page-x) 12px;
    border-radius: 26px;
    overflow: hidden;
}

.plan-row {
    display: grid;
    grid-template-columns: 1fr minmax(118px, 40%);
    gap: 12px;
    align-items: center;
    padding: 15px;
}

.plan-value {
    display: flex;
    flex-direction: column;
    gap: 7px;
    min-width: 0;
}

.plan-value span:last-child {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: -0.25px;
}

.plan-row input {
    width: 100%;
    min-width: 0;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 20px;
    outline: none;
    background: rgba(2, 6, 23, 0.34);
    color: var(--text);
    padding: 11px 12px;
    font-size: 25px;
    font-weight: 950;
    text-align: right;
    box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.18), var(--inner);
}

.progress-wrap {
    padding: 0 15px 14px;
}

.bar-track {
    height: 14px;
    border-radius: 999px;
    background: rgba(2, 6, 23, 0.42);
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.34);
}

.bar {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--red), var(--orange));
    transition: width 0.45s ease, background 0.25s ease;
    box-shadow: 0 0 24px currentColor;
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: rgba(255, 255, 255, 0.08);
    border-top: 1px solid rgba(255, 255, 255, 0.09);
}

.stat {
    padding: 12px 15px 14px;
    background: rgba(2, 6, 23, 0.18);
}

.stat.right {
    text-align: right;
}

.stat-value {
    margin-top: 5px;
    font-size: clamp(27px, 7.4vw, 36px);
    font-weight: 950;
    line-height: 1;
    letter-spacing: -1px;
}

.toolbar {
    flex: none;
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 10px;
    margin: 0 var(--page-x) 9px;
}

.toolbar h2 {
    margin: 0;
    font-size: 19px;
    letter-spacing: -0.35px;
}

.counter {
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    text-align: right;
}

.cards {
    display: grid;
    flex: 1;
    min-height: 0;
    align-content: start;
    gap: var(--card-gap);
    padding: 0 var(--page-x) 4px;
    overflow: hidden;
}

.card {
    position: relative;
    display: grid;
    grid-template-columns: var(--button-size) minmax(78px, 92px) minmax(54px, 1fr) var(--button-size);
    align-items: center;
    gap: 9px;
    height: var(--card-h);
    min-height: 0;
    padding: 10px;
    border-radius: 24px;
    overflow: hidden;
}

.card::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 0% 0%, rgba(56, 189, 248, 0.18), transparent 42%),
        linear-gradient(90deg, rgba(255, 255, 255, 0.11), transparent 46%);
    opacity: 0.9;
    pointer-events: none;
}

.card.excluded {
    opacity: 0.46;
    filter: grayscale(0.65);
}

.card-center {
    position: relative;
    min-width: 0;
    height: 100%;
    display: grid;
    align-content: center;
    gap: 6px;
    padding-left: 30px;
    text-align: left;
}

.card-count {
    position: relative;
    min-width: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.card-title {
    max-width: 100%;
    overflow: hidden;
    color: #ffffff;
    font-size: var(--card-title);
    font-weight: 950;
    line-height: 1;
    letter-spacing: -0.8px;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.card-meta {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 850;
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--blue);
    box-shadow: 0 0 16px var(--blue);
}

.card-trips {
    min-width: 0;
    margin: 0;
    padding: 8px 10px;
    min-width: 58px;
    border-radius: 18px;
    background: rgba(2, 6, 23, 0.28);
    border: 1px solid rgba(255, 255, 255, 0.10);
    font-size: var(--card-trips);
    font-weight: 950;
    line-height: 0.95;
    text-align: center;
    box-shadow: inset 0 1px rgba(255, 255, 255, 0.08);
}

.btn {
    position: relative;
    z-index: 1;
    width: var(--button-size);
    height: var(--button-size);
    border: 1px solid rgba(255, 255, 255, 0.17);
    border-radius: 19px;
    color: white;
    font-size: 35px;
    font-weight: 950;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, 0.08);
    box-shadow: var(--inner), 0 13px 28px rgba(0, 0, 0, 0.34);
    transition: transform 0.12s ease, filter 0.18s ease, opacity 0.18s ease;
}

.btn:active {
    transform: scale(0.93);
}

.btn.plus {
    background:
        radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.24), transparent 26px),
        linear-gradient(145deg, #34d399, #15803d);
}

.btn.minus {
    background:
        radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.20), transparent 26px),
        linear-gradient(145deg, #fb7185, #be123c);
}

.btn.disabled {
    opacity: 0.24;
    filter: grayscale(1);
    pointer-events: none;
}

.card-checkbox {
    position: absolute;
    left: calc(var(--button-size) + 18px);
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    width: 25px;
    height: 25px;
    margin: 0;
    appearance: none;
    -webkit-appearance: none;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: rgba(2, 6, 23, 0.38);
    box-shadow: var(--inner), 0 8px 18px rgba(0, 0, 0, 0.32);
}

.card-checkbox:checked {
    background: linear-gradient(135deg, #38bdf8, #2563eb);
}

.card-checkbox:checked::after {
    content: "✓";
    position: absolute;
    left: 5px;
    top: -1px;
    color: white;
    font-size: 18px;
    font-weight: 950;
}

.empty {
    margin: 8px 0 0;
    padding: 34px 24px;
    border: 1px dashed rgba(148, 163, 184, 0.36);
    border-radius: 26px;
    background: rgba(15, 23, 42, 0.42);
    color: var(--muted);
    text-align: center;
    font-size: 15px;
    font-weight: 800;
    box-shadow: inset 0 1px rgba(255, 255, 255, 0.06);
}

.fab,
.idle-btn {
    position: fixed;
    bottom: calc(var(--safe-bottom) + 2px);
    z-index: 10;
    width: 68px;
    height: 68px;
    border: 1px solid rgba(255, 255, 255, 0.24);
    border-radius: 24px;
    color: white;
    display: grid;
    place-items: center;
    box-shadow: var(--inner), 0 18px 44px rgba(0, 0, 0, 0.34);
    transition: transform 0.12s ease, background 0.2s ease, box-shadow 0.2s ease;
}

.fab {
    left: 50%;
    transform: translateX(-50%);
    background:
        radial-gradient(circle at 50% 25%, rgba(255, 255, 255, 0.27), transparent 30px),
        linear-gradient(145deg, #38bdf8, #2563eb 60%, #1d4ed8);
    font-size: 43px;
    font-weight: 850;
    line-height: 1;
    box-shadow: var(--inner), 0 18px 46px rgba(37, 99, 235, 0.52);
}

.fab:active {
    transform: translateX(-50%) scale(0.94);
}

.idle-btn {
    left: calc(50% + 72px);
    background:
        radial-gradient(circle at 50% 25%, rgba(255, 255, 255, 0.22), transparent 28px),
        linear-gradient(145deg, #f59e0b, #b45309);
    font-size: 14px;
    font-weight: 950;
    line-height: 1;
    letter-spacing: -0.4px;
    box-shadow: var(--inner), 0 18px 42px rgba(245, 158, 11, 0.34);
}

.idle-btn:active {
    transform: scale(0.94);
}

.idle-btn.running {
    background:
        radial-gradient(circle at 50% 25%, rgba(255, 255, 255, 0.24), transparent 28px),
        linear-gradient(145deg, #34d399, #15803d);
    box-shadow: var(--inner), 0 18px 42px rgba(34, 197, 94, 0.42);
}

.menu-backdrop {
    position: fixed;
    inset: 0;
    z-index: 11;
    background: rgba(2, 6, 23, 0.58);
    opacity: 0;
    pointer-events: none;
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    transition: opacity 0.25s ease;
}

.menu-backdrop.open {
    opacity: 1;
    pointer-events: auto;
}

.menu {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 12;
    width: min(430px, 100%);
    margin: 0 auto;
    padding: 16px var(--page-x) calc(18px + var(--safe-bottom));
    border-radius: 30px 30px 0 0;
    border: 1px solid var(--line);
    border-bottom: none;
    background: linear-gradient(180deg, rgba(30, 41, 59, 0.96), rgba(15, 23, 42, 0.96));
    -webkit-backdrop-filter: blur(26px) saturate(1.3);
    backdrop-filter: blur(26px) saturate(1.3);
    box-shadow: 0 -24px 60px rgba(0, 0, 0, 0.50), var(--inner);
    transform: translateY(105%);
    transition: transform 0.32s cubic-bezier(.2, .8, .2, 1);
}

.menu.open {
    transform: translateY(0);
}

.modal {
    position: fixed;
    left: 50%;
    top: 50%;
    z-index: 14;
    width: min(402px, calc(100% - 28px));
    padding: 18px;
    border-radius: 28px;
    background: linear-gradient(180deg, rgba(30, 41, 59, 0.96), rgba(15, 23, 42, 0.96));
    -webkit-backdrop-filter: blur(26px) saturate(1.3);
    backdrop-filter: blur(26px) saturate(1.3);
    border: 1px solid var(--line);
    box-shadow: 0 26px 76px rgba(0, 0, 0, 0.58), var(--inner);
    transform: translate(-50%, -46%) scale(0.96);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease, transform 0.22s ease;
}

.modal.open {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
}

.modal h3 {
    margin: 0 0 15px;
    font-size: 22px;
    line-height: 1.15;
    letter-spacing: -0.45px;
}

.field {
    display: grid;
    gap: 8px;
    margin-bottom: 14px;
}

.field input {
    width: 100%;
    min-height: 56px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 20px;
    outline: none;
    background: rgba(2, 6, 23, 0.34);
    color: white;
    padding: 0 15px;
    font-size: 23px;
    font-weight: 900;
    box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.18), var(--inner);
}

.capacity-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
    margin-bottom: 16px;
}

.capacity-option {
    min-height: 68px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 21px;
    background: rgba(255, 255, 255, 0.08);
    color: white;
    display: grid;
    place-items: center;
    gap: 2px;
    padding: 8px 6px;
    box-shadow: var(--inner);
}

.capacity-option strong {
    font-size: 21px;
    line-height: 1;
}

.capacity-option span {
    color: var(--muted);
    font-size: 11px;
    font-weight: 850;
}

.capacity-option.active {
    border-color: rgba(56, 189, 248, 0.82);
    background: linear-gradient(145deg, rgba(56, 189, 248, 0.36), rgba(37, 99, 235, 0.34));
    box-shadow: 0 0 28px rgba(56, 189, 248, 0.22), var(--inner);
}

.modal-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.modal-btn {
    min-height: 56px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    color: white;
    font-weight: 900;
    font-size: 16px;
    box-shadow: var(--inner);
}

.modal-btn.primary {
    background: linear-gradient(135deg, #38bdf8, #2563eb);
}

.modal-btn.secondary {
    background: rgba(255, 255, 255, 0.10);
}

.handle {
    width: 44px;
    height: 5px;
    margin: 0 auto 16px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.26);
}

.menu-grid {
    display: grid;
    gap: 10px;
}

.action {
    width: 100%;
    min-height: 60px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 21px;
    color: white;
    font-size: 17px;
    font-weight: 900;
    text-align: left;
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--inner), 0 12px 26px rgba(0, 0, 0, 0.20);
}

.action span:last-child {
    width: 34px;
    height: 34px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, 0.17);
}

.add { background: linear-gradient(135deg, #38bdf8, #2563eb); }
.send { background: linear-gradient(135deg, #34d399, #15803d); }
.reset { background: linear-gradient(135deg, #fb7185, #dc2626); }
.stats-action { background: linear-gradient(135deg, #a78bfa, #6d28d9); }
.close { background: rgba(255, 255, 255, 0.10); }

@media (max-width: 380px) {
    :root {
        --page-x: 10px;
        --button-size: 50px;
    }

    body {
        padding-top: var(--safe-top);
    }

    .card {
        gap: 8px;
        padding: 9px;
        border-radius: 21px;
    }

    .btn {
        font-size: 32px;
        border-radius: 17px;
    }

    .plan-row {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    .plan-row input {
        font-size: 26px;
    }

    .action {
        min-height: 54px;
        font-size: 16px;
    }

    .modal {
        width: calc(100% - 20px);
        padding: 16px;
    }

    .capacity-grid {
        gap: 7px;
    }

    .capacity-option {
        min-height: 62px;
    }

    .idle-btn {
        left: calc(50% + 68px);
    }
}

@media (min-width: 390px) and (max-width: 430px) {
    .dashboard {
        margin-bottom: 11px;
    }

    .brand-title span,
    .label,
    .counter {
        font-size: 11px;
    }
}

.cards.compact {
    --card-h: 72px;
    --card-title: 24px;
    --card-trips: 36px;
    --card-gap: 7px;
    --button-size: 48px;
}

.cards.compact .card-meta {
    font-size: 12px;
}

.cards.ultra {
    --card-h: 58px;
    --card-title: 21px;
    --card-trips: 30px;
    --card-gap: 5px;
    --button-size: 42px;
}

.cards.ultra .card {
    padding: 7px;
    border-radius: 17px;
    grid-template-columns: var(--button-size) minmax(58px, 74px) minmax(42px, 1fr) var(--button-size);
}

.cards.ultra .card-meta {
    display: none;
}

.cards.ultra .btn {
    font-size: 28px;
    border-radius: 15px;
}

.cards.ultra .card-center {
    padding-left: 24px;
}

.cards.ultra .card-trips {
    min-width: 0;
    padding: 5px 7px;
}

.cards.ultra .card-checkbox {
    width: 20px;
    height: 20px;
    border-radius: 7px;
    left: calc(var(--button-size) + 13px);
    top: 50%;
}

.cards.ultra .card-checkbox:checked::after {
    left: 4px;
    top: -2px;
    font-size: 15px;
}

.stats-page {
    position: fixed;
    inset: 0;
    z-index: 20;
    width: min(430px, 100%);
    margin: 0 auto;
    padding: var(--safe-top) var(--page-x) calc(18px + var(--safe-bottom));
    background:
        radial-gradient(circle at 20% -8%, rgba(56, 189, 248, 0.26), transparent 34rem),
        radial-gradient(circle at 100% 0%, rgba(34, 197, 94, 0.18), transparent 30rem),
        linear-gradient(180deg, rgba(2, 6, 23, 0.92), rgba(2, 6, 23, 0.98));
    transform: translateX(105%);
    transition: transform 0.28s cubic-bezier(.2, .8, .2, 1);
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.stats-page.open {
    transform: translateX(0);
}

.stats-open .fab,
.stats-open .idle-btn {
    display: none;
}

.stats-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex: none;
}

.stats-head h2 {
    margin: 0;
    font-size: 28px;
    line-height: 1;
    letter-spacing: -0.8px;
}

.back-btn {
    width: 48px;
    height: 48px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.10);
    color: white;
    font-size: 25px;
    font-weight: 900;
    box-shadow: var(--inner);
}

.stats-total {
    flex: none;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.total-card {
    padding: 14px;
    border-radius: 24px;
    border: 1px solid var(--line);
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.10), rgba(15, 23, 42, 0.68));
    box-shadow: var(--shadow), var(--inner);
}

.total-card strong {
    display: block;
    margin-top: 7px;
    font-size: 27px;
    line-height: 1;
    font-weight: 950;
    letter-spacing: -0.9px;
}

.shift-list {
    flex: 1;
    min-height: 0;
    overflow: auto;
    display: grid;
    align-content: start;
    gap: 10px;
    padding-bottom: 4px;
}

.shift-card {
    padding: 14px;
    border-radius: 24px;
    border: 1px solid var(--line);
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.10), rgba(15, 23, 42, 0.70));
    box-shadow: var(--shadow), var(--inner);
}

.shift-card-top {
    display: flex;
    justify-content: space-between;
    align-items: start;
    gap: 10px;
    margin-bottom: 12px;
}

.shift-date {
    font-size: 17px;
    font-weight: 950;
    letter-spacing: -0.35px;
}

.shift-percent {
    min-width: 58px;
    padding: 7px 9px;
    border-radius: 999px;
    background: rgba(56, 189, 248, 0.16);
    color: #bae6fd;
    text-align: center;
    font-size: 13px;
    font-weight: 950;
}

.shift-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 12px;
}

.shift-metric {
    padding: 10px;
    border-radius: 17px;
    background: rgba(2, 6, 23, 0.28);
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.shift-metric span {
    display: block;
    color: var(--muted);
    font-size: 10px;
    font-weight: 850;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.shift-metric strong {
    display: block;
    margin-top: 5px;
    font-size: 18px;
    line-height: 1;
    font-weight: 950;
}

.shift-progress {
    height: 10px;
    border-radius: 999px;
    overflow: hidden;
    background: rgba(2, 6, 23, 0.42);
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.shift-progress span {
    display: block;
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--orange), var(--green));
}

.stats-empty {
    padding: 34px 22px;
    border-radius: 26px;
    border: 1px dashed rgba(148, 163, 184, 0.36);
    background: rgba(15, 23, 42, 0.42);
    color: var(--muted);
    text-align: center;
    font-size: 15px;
    font-weight: 800;
}
</style>
</head>

<body>
<main class="shell">
    <header class="topbar">
        <div class="brand">
            <div class="brand-title">
                <span>Сменный учет</span>
                <strong>БелАЗ</strong>
            </div>
            <div class="status-chip" id="status">0 машин</div>
        </div>
    </header>

    <section class="dashboard glass">
        <div class="plan-row">
            <div class="plan-value">
                <span class="label">План</span>
                <span>Кубатура за смену</span>
            </div>
            <input type="number" id="plan" value="3000" inputmode="decimal" aria-label="План">
        </div>

        <div class="progress-wrap">
            <div class="bar-track"><div class="bar" id="bar"></div></div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="label">Сделано</div>
                <div class="stat-value" id="done">0.0</div>
            </div>
            <div class="stat right">
                <div class="label">Осталось / плюс</div>
                <div class="stat-value" id="left">3000.0</div>
            </div>
        </div>
    </section>

    <div class="toolbar">
        <h2>Машины</h2>
        <div class="counter" id="counter">Нет активных рейсов</div>
    </div>

    <section class="cards" id="cards"></section>
</main>
<section class="stats-page" id="statsPage" aria-label="Статистика смен">
    <div class="stats-head">
        <div>
            <span class="label">Архив</span>
            <h2>Статистика</h2>
        </div>
        <button class="back-btn" type="button" onclick="closeStats()" aria-label="Назад">←</button>
    </div>

    <div class="stats-total">
        <div class="total-card">
            <span class="label">Всего вывезено</span>
            <strong id="statsTotalVolume">0.0</strong>
        </div>
        <div class="total-card">
            <span class="label">Всего простоя</span>
            <strong id="statsTotalIdle">00:00</strong>
        </div>
    </div>

    <div class="shift-list" id="shiftList"></div>
</section>

<button class="fab" id="fab" aria-label="Меню">+</button>
<button class="idle-btn" id="idleTimer" type="button" aria-label="Секундомер простоя">00:00</button>
<div class="menu-backdrop" id="menuBackdrop"></div>

<div class="menu" id="menu">
    <div class="handle"></div>
    <div class="menu-grid">
        <button class="action add" onclick="addBelaz()"><span>Добавить БелАЗ</span><span>+</span></button>
        <button class="action send" onclick="sendReport()"><span>Отправить диспетчеру</span><span>↗</span></button>
        <button class="action stats-action" onclick="openStats()"><span>Статистика</span><span>▦</span></button>
        <button class="action reset" onclick="resetShift()"><span>Сбросить смену</span><span>×</span></button>
        <button class="action close" onclick="closeMenu()"><span>Закрыть</span><span>⌄</span></button>
    </div>
</div>

<div class="modal" id="addModal" role="dialog" aria-modal="true" aria-labelledby="addModalTitle">
    <h3 id="addModalTitle">Новый БелАЗ</h3>
    <label class="field">
        <span class="label">Номер машины</span>
        <input type="text" id="belazNumber" inputmode="numeric" autocomplete="off" placeholder="Например 128">
    </label>
    <div class="field">
        <span class="label">Кубатура</span>
        <div class="capacity-grid" id="capacityGrid">
            <button class="capacity-option active" type="button" data-capacity="37.8"><strong>37.8</strong><span>м³</span></button>
            <button class="capacity-option" type="button" data-capacity="36"><strong>36.0</strong><span>м³</span></button>
            <button class="capacity-option" type="button" data-capacity="22"><strong>22.0</strong><span>м³</span></button>
        </div>
    </div>
    <div class="modal-actions">
        <button class="modal-btn secondary" type="button" onclick="closeAddModal()">Отмена</button>
        <button class="modal-btn primary" type="button" onclick="confirmAddBelaz()">Добавить</button>
    </div>
</div>

<script>
const capacities = [37.8, 36, 22];
let belazList = JSON.parse(localStorage.getItem("belazList") || "[]")
    .map((b, i) => ({ ...b, originalIndex: b.originalIndex ?? i }));

let plan = parseFloat(localStorage.getItem("plan") || "3000");
const planInput = document.getElementById("plan");
const cards = document.getElementById("cards");
const menu = document.getElementById("menu");
const menuBackdrop = document.getElementById("menuBackdrop");
const addModal = document.getElementById("addModal");
const belazNumber = document.getElementById("belazNumber");
const capacityGrid = document.getElementById("capacityGrid");
const idleTimer = document.getElementById("idleTimer");
const statsPage = document.getElementById("statsPage");
const shiftList = document.getElementById("shiftList");
let shiftHistory = JSON.parse(localStorage.getItem("shiftHistory") || "[]");
let idleSeconds = parseInt(localStorage.getItem("idleSeconds") || "0", 10);
let idleRunning = localStorage.getItem("idleRunning") === "true";
let idleStartedAt = parseInt(localStorage.getItem("idleStartedAt") || Date.now(), 10);
let idleTicker = null;
let selectedCapacity = capacities[0];

planInput.value = plan;

function save() {
    localStorage.setItem("belazList", JSON.stringify(belazList));
    localStorage.setItem("plan", plan);
}


function saveShiftHistory() {
    localStorage.setItem("shiftHistory", JSON.stringify(shiftHistory));
}

function getShiftSummary() {
    const activeBelaz = belazList.filter(b => !b.exclude);
    const volume = activeBelaz.reduce((sum, b) => sum + b.trips * b.capacity, 0);
    const trips = activeBelaz.reduce((sum, b) => sum + b.trips, 0);
    return {
        date: new Date().toISOString(),
        machines: activeBelaz.length,
        volume,
        trips,
        idleSeconds: getIdleSeconds(),
        plan
    };
}
function calc() {
    const activeBelaz = belazList.filter(b => !b.exclude);
    const total = activeBelaz.reduce((sum, b) => sum + b.trips * b.capacity, 0);
    const percent = total / plan;
    const over = Math.max(0, total - plan);
    const trips = activeBelaz.reduce((sum, b) => sum + b.trips, 0);
    const activeCount = activeBelaz.length;

    document.getElementById("done").textContent = total.toFixed(1);
    document.getElementById("left").textContent = over > 0 ? `+${over.toFixed(1)}` : (plan - total).toFixed(1);
    document.getElementById("left").style.color = over > 0 ? "var(--violet)" : "var(--orange)";
    document.getElementById("counter").textContent = trips ? `${trips} рейсов сегодня` : "Нет активных рейсов";
    document.getElementById("status").textContent = `${activeCount}/${belazList.length} активны`;

    const bar = document.getElementById("bar");
    bar.style.width = `${Math.min(percent * 100, 100)}%`;
    bar.style.background = percent < 0.7
        ? "linear-gradient(90deg, var(--red), var(--orange))"
        : percent < 1
            ? "linear-gradient(90deg, var(--orange), var(--yellow, #fde047))"
            : "linear-gradient(90deg, var(--green), var(--blue))";
}

function machineWord(count) {
    if (count % 10 === 1 && count % 100 !== 11) return "машина";
    if ([2, 3, 4].includes(count % 10) && ![12, 13, 14].includes(count % 100)) return "машины";
    return "машин";
}

function renderCards() {
    cards.innerHTML = "";
    cards.classList.remove("compact", "ultra");

    if (!belazList.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Нажмите плюс, чтобы добавить первый БелАЗ";
        cards.appendChild(empty);
        adjustCardDensity();
        calc();
        return;
    }

    belazList.forEach((b, i) => {
        const card = document.createElement("article");
        card.className = `card glass${b.exclude ? " excluded" : ""}`;

        const minus = document.createElement("button");
        minus.className = `btn minus${b.exclude ? " disabled" : ""}`;
        minus.type = "button";
        minus.textContent = "−";
        minus.setAttribute("aria-label", "Уменьшить рейсы");
        minus.onclick = () => changeTrip(i, -1);

        const center = document.createElement("div");
        center.className = "card-center";

        const title = document.createElement("div");
        title.className = "card-title";
        title.textContent = b.number;

        const meta = document.createElement("div");
        meta.className = "card-meta";
        meta.innerHTML = `<span class="dot"></span><span>${b.capacity} м³</span>`;

        const trips = document.createElement("div");
        trips.className = "card-trips";
        trips.textContent = b.trips;

        const count = document.createElement("div");
        count.className = "card-count";
        count.appendChild(trips);

        center.append(title, meta);

        const plus = document.createElement("button");
        plus.className = `btn plus${b.exclude ? " disabled" : ""}`;
        plus.type = "button";
        plus.textContent = "+";
        plus.setAttribute("aria-label", "Добавить рейс");
        plus.onclick = () => changeTrip(i, 1);

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "card-checkbox";
        checkbox.checked = Boolean(b.exclude);
        checkbox.setAttribute("aria-label", "Исключить машину из расчета");
        checkbox.onchange = () => toggleExclude(i);

        card.append(minus, center, count, plus, checkbox);
        cards.appendChild(card);
    });

    adjustCardDensity();
    calc();
}

function adjustCardDensity() {
    cards.classList.remove("compact", "ultra");
    cards.style.removeProperty("--card-h");
    cards.style.removeProperty("--button-size");
    cards.style.removeProperty("--card-title");
    cards.style.removeProperty("--card-trips");
    const count = belazList.length;
    if (!count) return;

    const available = cards.clientHeight;
    const normalHeight = 86;
    const compactHeight = 72;
    const normalGap = 8;
    const compactGap = 7;

    if (count * normalHeight + Math.max(0, count - 1) * normalGap <= available) return;

    cards.classList.add("compact");
    if (count * compactHeight + Math.max(0, count - 1) * compactGap <= available) return;

    cards.classList.add("ultra");
    const gap = 5;
    const fittedHeight = Math.floor((available - Math.max(0, count - 1) * gap) / count);
    const rowHeight = Math.max(34, Math.min(58, fittedHeight));
    cards.style.setProperty("--card-h", `${rowHeight}px`);
    cards.style.setProperty("--button-size", `${Math.max(30, rowHeight - 8)}px`);
    cards.style.setProperty("--card-title", `${Math.max(15, Math.min(21, rowHeight * 0.36))}px`);
    cards.style.setProperty("--card-trips", `${Math.max(20, Math.min(32, rowHeight * 0.56))}px`);
}

function changeTrip(i, delta) {
    const next = belazList[i].trips + delta;
    if (next >= 0) {
        belazList[i].trips = next;
        save();
        renderCards();
    }
}

function toggleExclude(i) {
    const item = belazList[i];
    item.exclude = !item.exclude;
    belazList.splice(i, 1);

    if (item.exclude) {
        belazList.push(item);
    } else {
        const pos = belazList.findIndex(e => e.originalIndex > item.originalIndex);
        belazList.splice(pos === -1 ? belazList.length : pos, 0, item);
    }

    save();
    renderCards();
}

function addBelaz() {
    closeMenu();
    selectedCapacity = capacities[0];
    belazNumber.value = "";
    updateCapacityButtons();
    addModal.classList.add("open");
    menuBackdrop.classList.add("open");
    setTimeout(() => belazNumber.focus(), 120);
}

function confirmAddBelaz() {
    const number = belazNumber.value.trim();
    if (!number) {
        belazNumber.focus();
        return;
    }

    belazList.push({
        number,
        capacity: selectedCapacity,
        trips: 0,
        exclude: false,
        originalIndex: belazList.length
    });

    save();
    renderCards();
    closeAddModal();
}

function closeAddModal() {
    addModal.classList.remove("open");
    menuBackdrop.classList.remove("open");
}

function updateCapacityButtons() {
    capacityGrid.querySelectorAll(".capacity-option").forEach(button => {
        button.classList.toggle("active", Number(button.dataset.capacity) === selectedCapacity);
    });
}


function getIdleSeconds() {
    if (!idleRunning) return idleSeconds;
    return idleSeconds + Math.floor((Date.now() - idleStartedAt) / 1000);
}

function formatIdleTime(seconds) {
    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    const secs = seconds % 60;
    const two = value => String(value).padStart(2, "0");
    return hours ? `${hours}:${two(minutes)}:${two(secs)}` : `${two(minutes)}:${two(secs)}`;
}

function saveIdleTimer() {
    localStorage.setItem("idleSeconds", String(idleSeconds));
    localStorage.setItem("idleRunning", String(idleRunning));
    localStorage.setItem("idleStartedAt", String(idleStartedAt));
}

function renderIdleTimer() {
    idleTimer.textContent = formatIdleTime(getIdleSeconds());
    idleTimer.classList.toggle("running", idleRunning);
    idleTimer.setAttribute("aria-label", idleRunning ? "Пауза секундомера простоя" : "Запустить секундомер простоя");
}

function startIdleTicker() {
    if (idleTicker) clearInterval(idleTicker);
    idleTicker = setInterval(renderIdleTimer, 1000);
}

function toggleIdleTimer() {
    if (idleRunning) {
        idleSeconds = getIdleSeconds();
        idleRunning = false;
    } else {
        idleStartedAt = Date.now();
        idleRunning = true;
    }
    saveIdleTimer();
    renderIdleTimer();
}

function resetIdleTimer() {
    idleSeconds = 0;
    idleRunning = false;
    idleStartedAt = Date.now();
    saveIdleTimer();
    renderIdleTimer();
}

function formatShiftDate(value) {
    return new Date(value).toLocaleString("ru-RU", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}

function renderStats() {
    const totalVolume = shiftHistory.reduce((sum, shift) => sum + Number(shift.volume || 0), 0);
    const totalIdle = shiftHistory.reduce((sum, shift) => sum + Number(shift.idleSeconds || 0), 0);
    document.getElementById("statsTotalVolume").textContent = totalVolume.toFixed(1);
    document.getElementById("statsTotalIdle").textContent = formatIdleTime(totalIdle);
    shiftList.innerHTML = "";

    if (!shiftHistory.length) {
        const empty = document.createElement("div");
        empty.className = "stats-empty";
        empty.textContent = "Смен пока нет. Смена попадет сюда после сброса.";
        shiftList.appendChild(empty);
        return;
    }

    [...shiftHistory].reverse().forEach(shift => {
        const percent = shift.plan > 0 ? Math.min((shift.volume / shift.plan) * 100, 100) : 0;
        const card = document.createElement("article");
        card.className = "shift-card";
        card.innerHTML = `
            <div class="shift-card-top">
                <div>
                    <div class="shift-date">${formatShiftDate(shift.date)}</div>
                    <div class="counter">План: ${Number(shift.plan || 0).toFixed(1)} м³</div>
                </div>
                <div class="shift-percent">${Math.round(percent)}%</div>
            </div>
            <div class="shift-grid">
                <div class="shift-metric"><span>Машин</span><strong>${shift.machines || 0}</strong></div>
                <div class="shift-metric"><span>Кубов</span><strong>${Number(shift.volume || 0).toFixed(1)}</strong></div>
                <div class="shift-metric"><span>Простой</span><strong>${formatIdleTime(Number(shift.idleSeconds || 0))}</strong></div>
            </div>
            <div class="shift-progress"><span style="width: ${percent}%"></span></div>
        `;
        shiftList.appendChild(card);
    });
}

function openStats() {
    closeMenu();
    renderStats();
    statsPage.classList.add("open");
    document.body.classList.add("stats-open");
}

function closeStats() {
    statsPage.classList.remove("open");
    document.body.classList.remove("stats-open");
}
function sendReport() {
    const active = belazList.filter(b => !b.exclude && b.trips > 0);
    const reportLines = active.length ? active.map(b => `${b.number} - ${b.trips}`) : ["-"];
    const text = reportLines.join("\n");
    location.href = "https://max.ru/:share?text=" + encodeURIComponent(text);
}

function resetShift() {
    if (confirm("Сохранить смену в статистику и сбросить текущие данные?")) {
        const summary = getShiftSummary();
        const hasWork = summary.machines > 0 || summary.volume > 0 || summary.trips > 0 || summary.idleSeconds > 0;
        if (hasWork) {
            shiftHistory.push(summary);
            saveShiftHistory();
        }

        belazList = [];
        plan = 3000;
        localStorage.removeItem("belazList");
        localStorage.removeItem("plan");
        planInput.value = plan;
        resetIdleTimer();
        renderCards();
        renderStats();
        closeMenu();
    }
}

function openMenu() {
    menu.classList.add("open");
    menuBackdrop.classList.add("open");
}

function closeMenu() {
    menu.classList.remove("open");
    if (!addModal.classList.contains("open")) {
        menuBackdrop.classList.remove("open");
    }
}

document.getElementById("fab").onclick = openMenu;
menuBackdrop.onclick = () => {
    closeMenu();
    closeAddModal();
};

capacityGrid.onclick = event => {
    const button = event.target.closest(".capacity-option");
    if (!button) return;
    selectedCapacity = Number(button.dataset.capacity);
    updateCapacityButtons();
};

belazNumber.onkeydown = event => {
    if (event.key === "Enter") confirmAddBelaz();
};

planInput.oninput = event => {
    plan = Math.max(parseFloat(event.target.value) || 3000, 1);
    save();
    calc();
};

window.addEventListener("resize", adjustCardDensity);

idleTimer.onclick = toggleIdleTimer;
startIdleTicker();
renderIdleTimer();
renderStats();
renderCards();
</script>
</body>
</html>
